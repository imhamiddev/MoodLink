name: Build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7 needs Gradle 8.9+; pin it instead of relying on the runner image.
          gradle-version: 8.10.2
      - name: Build debug APK
        env:
          # Add these under Settings → Secrets and variables → Actions.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Unresolved" build.log | head -8 | cut -c1-400 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: moodlink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
